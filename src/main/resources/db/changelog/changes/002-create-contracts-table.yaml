databaseChangeLog:
  - changeSet:
      id: 002-create-contracts-table
      author: loyermalin
      changes:
        - createTable:
            tableName: contracts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: rent_amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: due_day
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: cashback_rate
                  type: DECIMAL(5,2)
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_contract_tenant_id_status
            tableName: contracts
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: status